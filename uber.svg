graph LR
    %% Palette Configuration Matrix
    classDef storage fill:#1e293b,stroke:#475569,stroke-width:2px,color:#f8fafc;
    classDef capture fill:#ec4899,fill-opacity:0.1,stroke:#ec4899,stroke-width:2px,color:#f472b6;
    classDef broker fill:#f59e0b,fill-opacity:0.1,stroke:#f59e0b,stroke-width:2px,color:#fbbf24;
    classDef consumer fill:#10b981,fill-opacity:0.1,stroke:#10b981,stroke-width:2px,color:#34d399;
    classDef fault fill:#ef4444,fill-opacity:0.1,stroke:#ef4444,stroke-width:2px,color:#f87171;

    %% Data Plane Infrastructure Nodes
    DB[(PostgreSQL Pod<br/>WAL Log Engine)]:::storage
    DEB[Debezium Connect<br/>Capture Pod]:::capture
    KAFKA{Apache Kafka Broker<br/>Log Stream Hub}:::broker
    APP[Spring Boot App<br/>Java 21 Virtual Threads]:::consumer
    DLQ[Dead Letter Queue<br/>Poison Pill Vault]:::fault

    %% Transaction Pipeline Interconnect Routing
    DB -->|Real-Time Tail| DEB
    DEB -->|JSON Schema Strings| KAFKA
    
    %% Engine Processing Stream Split
    KAFKA -->|Valid Events| APP
    KAFKA -->|Malformed Payloads| DLQ

    %% Layout Readme Text Alignment Styling
    style DB font-weight:bold;
    style DEB font-weight:bold;
    style KAFKA font-weight:bold;
    style APP font-weight:bold;
    style DLQ font-weight:bold;
