<svg xmlns="http://w3.org" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Header Text Group -->
  <text x="50" y="60" fill="#ffffff" font-size="26" font-weight="800" letter-spacing="-0.5">Uber Real-Time CDC Payment Processing Engine Architecture Topology</text>
  <text x="50" y="90" fill="#94a3b8" font-size="15" font-weight="500">Log-Based Transaction Streaming with Fault-Isolated Poison Pill Containment Pipelines</text>

  <!-- Flow Line Links (Engine Pipeline Infrastructure Matrix) -->
  <!-- Horizontal Core Ingestion Trail -->
  <path d="M 180 230 L 380 230" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M 480 230 L 680 230" stroke="#38bdf8" stroke-width="3" />
  
  <!-- Downward Valid Processing Stream Bridge -->
  <path d="M 560 230 L 560 450" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
  
  <!-- Downward Isolated Poison Pill Stream Escape -->
  <path d="M 780 230 L 780 450" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Flow Pathway Floating Text Strings -->
  <text x="240" y="215" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">REAL-TIME TAIL</text>
  <text x="580" y="215" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">JSON STREAMS</text>
  <text x="440" y="340" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.5" text-anchor="middle">Valid Events ➔ Virtual Threads</text>
  <text x="910" y="340" fill="#f43f5e" font-size="12" font-weight="700" letter-spacing="0.5" text-anchor="middle">Poison Pills ➔ Isolated Parsing</text>

  <!-- Architectural Component Nodes (Boxes) -->
  <!-- 1. Source Transaction Node -->
  <g transform="translate(50, 170)">
    <rect width="130" height="120" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M 10 15 L 10 105" stroke="#38bdf8" stroke-width="4" stroke-dasharray="4,4" />
    <text x="70" y="60" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL</text>
    <text x="70" y="80" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">WAL Storage Engine</text>
  </g>

  <!-- 2. Debezium Log Capture Engine Node -->
  <g transform="translate(350, 170)">
    <rect width="130" height="120" rx="12" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="2"/>
    <text x="65" y="60" fill="#f472b6" font-size="14" font-weight="700" text-anchor="middle">Debezium</text>
    <text x="65" y="80" fill="#f472b6" font-size="11" font-weight="600" text-anchor="middle">Capture Connect Pod</text>
  </g>

  <!-- 3. Streaming Log Broker (Apache Kafka Hub) Node -->
  <g transform="translate(650, 170)">
    <rect width="130" height="120" rx="12" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="2"/>
    <text x="65" y="60" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">Apache Kafka</text>
    <text x="65" y="80" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">Log Stream Broker</text>
  </g>

  <!-- 4. Target Application Engine Processing Consumer Node -->
  <g transform="translate(495, 450)">
    <rect width="130" height="120" rx="12" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="2"/>
    <text x="65" y="55" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">Spring Boot App</text>
    <text x="65" y="75" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Java 21 Engine</text>
    <text x="65" y="95" fill="#64748b" font-size="10" font-weight="500" text-anchor="middle">Virtual Thread Workers</text>
  </g>

  <!-- 5. Poison Pill Intercept & Dead Letter Isolation Storage Node -->
  <g transform="translate(715, 450)">
    <rect width="130" height="120" rx="12" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="2"/>
    <text x="65" y="55" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">Kafka DLQ</text>
    <text x="65" y="75" fill="#f87171" font-size="11" font-weight="600" text-anchor="middle">Poison Pill Storage</text>
    <text x="65" y="95" fill="#64748b" font-size="10" font-weight="500" text-anchor="middle">Audit Sinks</text>
  </g>

  <!-- Corrected Visual Mapping Key Legend Base -->
  <g transform="translate(50, 600)">
    <!-- Pipeline Infrastructure -->
    <line x1="0" y1="10" x2="25" y2="10" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="35" y="14" fill="#94a3b8" font-size="12" font-weight="600">Pipeline Infrastructure Map</text>

    <!-- Source Database -->
    <rect x="230" y="2" width="16" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="255" y="14" fill="#94a3b8" font-size="12" font-weight="600">Source DB</text>

    <!-- Log Capture Engine -->
    <rect x="360" y="2" width="16" height="16" rx="4" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.5"/>
    <text x="385" y="14" fill="#94a3b8" font-size="12" font-weight="600">Capture Engine</text>

    <!-- Broker Hub -->
    <rect x="510" y="2" width="16" height="16" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="535" y="14" fill="#94a3b8" font-size="12" font-weight="600">Broker Hub</text>

    <!-- Processing Consumer Engine -->
    <rect x="645" y="2" width="16" height="16" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <text x="670" y="14" fill="#94a3b8" font-size="12" font-weight="600">App Consumer</text>

    <!-- Containment Error Vault -->
    <rect x="795" y="2" width="16" height="16" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="820" y="14" fill="#94a3b8" font-size="12" font-weight="600">Containment Vault</text>
  </g>
</svg>
